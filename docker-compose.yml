# DescubreTarija - Tecnologia Web I - UPDS Tarija
#   web        -> Apache + PHP 8.3     http://localhost:8090
#   db         -> MySQL 8.4            127.0.0.1:3308
#   phpmyadmin -> admin de la BD       http://localhost:8091
# Encender: docker compose up -d --build
# Apagar:   docker compose down
# BD desde cero: docker compose down -v

services:

  web:
    build: ./docker/php
    container_name: tarija-web
    ports:
      - "8090:80"
    volumes:
      - ./www:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: descubretarija
      DB_USER: tarija
      DB_PASS: tarija123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: tarija-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: descubretarija
      MYSQL_USER: tarija
      MYSQL_PASSWORD: tarija123
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - tarija-datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: tarija-pma
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_USER: tarija
      PMA_PASSWORD: tarija123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tarija-datos: